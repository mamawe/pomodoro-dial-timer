<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#140a0c">
  <title>暖红拨盘番茄钟</title>
  <link rel="stylesheet" href="css/pomodoro.css">
</head>
<body>
<div id="app" class="pomodoro-app">

  <!-- 顶部导航 -->
  <header class="pomo-header">
    <a class="header-back-link" href="index.html#/home" aria-label="返回首页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 class="pomo-title">暖红拨盘番茄钟</h1>
    <button class="focus-toggle" id="focusToggle" type="button" aria-label="专注度检测">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/></svg>
    </button>
  </header>

  <!-- 主内容区 -->
  <main class="pomo-body">

    <!-- 状态条码 -->
    <div class="status-bar">
      <span data-status="mode">设定时间</span>
      <i></i>
      <span data-status="cycle">第 1 个番茄</span>
      <i></i>
      <span data-status="focus">检测关闭</span>
    </div>

    <!-- 双拨盘区域 -->
    <div class="dial-panel" id="dialPanel">
      <!-- 顶部时间显示 -->
      <div class="dial-display">
        <div class="dial-status" id="dialStatus">SET TIMER</div>
        <div class="dial-time">
          <span class="dial-time-min" id="dialMin">25</span>
          <span class="dial-time-sep">:</span>
          <span class="dial-time-sec" id="dialSec">00</span>
        </div>
        <div class="dial-labels">
          <span class="dial-label dial-label-outer">外圈: 分钟</span>
          <span class="dial-label dial-label-inner">内圈: 秒钟</span>
        </div>
      </div>

      <!-- SVG 拨盘 -->
      <svg class="dial-svg" id="dialSvg" viewBox="0 0 360 360" aria-hidden="true">
        <!-- 刻度标记 -->
        <g class="dial-ticks" id="dialTicks"></g>

        <!-- 外圈轨道 -->
        <path class="dial-track dial-track-outer" id="trackOuter" />
        <!-- 外圈进度 -->
        <path class="dial-progress dial-progress-outer" id="progressOuter" />
        <!-- 外圈 Knob -->
        <circle class="dial-knob dial-knob-outer" id="knobOuter" r="10" />

        <!-- 内圈轨道 -->
        <path class="dial-track dial-track-inner" id="trackInner" />
        <!-- 内圈进度 -->
        <path class="dial-progress dial-progress-inner" id="progressInner" />
        <!-- 内圈 Knob -->
        <circle class="dial-knob dial-knob-inner" id="knobInner" r="8" />
      </svg>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button class="ctrl-btn ctrl-btn-start" id="btnStart" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>
        <span>开始</span>
      </button>
      <button class="ctrl-btn ctrl-btn-reset" id="btnReset" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>重置</span>
      </button>
    </div>

    <!-- 专注度检测面板 -->
    <div class="focus-card" id="focusCard" hidden>
      <div class="focus-card-head">
        <h3>专注度检测</h3>
        <span class="focus-score" id="focusScore">--</span>
      </div>
      <div class="focus-metrics">
        <div class="focus-metric">
          <span class="focus-metric-label">标签可见</span>
          <span class="focus-metric-val" id="focusVisible">--</span>
        </div>
        <div class="focus-metric">
          <span class="focus-metric-label">键盘活跃</span>
          <span class="focus-metric-val" id="focusKeystroke">--</span>
        </div>
        <div class="focus-metric">
          <span class="focus-metric-label">持续时长</span>
          <span class="focus-metric-val" id="focusDuration">--</span>
        </div>
      </div>
      <p class="focus-note">基于浏览器可见性与交互事件的专注度估算</p>
    </div>

    <!-- 底部提示 -->
    <p class="pomo-hint">
      拖动右下角弧线拨盘设定时间 · 外圈=分钟 · 内圈=秒钟
    </p>

  </main>
</div>

<script src="js/pomodoro.js"></script>
</body>
</html>
