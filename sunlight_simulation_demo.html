<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 建筑日照与采光分析</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { overflow: hidden; background-color: #1a1a1a; color: #333;
            display: flex; height: 100vh; width: 100vw; }

        #canvas-container { flex: 1; height: 100%; position: relative; }
        #canvas-container canvas { display: block; }

        #ui-panel { width: 380px; height: 100%; background: #fff;
            box-shadow: -2px 0 15px rgba(0,0,0,0.15); padding: 18px;
            overflow-y: auto; z-index: 10; display: flex; flex-direction: column; gap: 14px; }

        h2 { font-size: 1.1rem; color: #1e293b; padding-bottom: 8px; }
        h2.step1-title { border-bottom: 2px solid #10b981; }
        h2.step2-title { border-bottom: 2px solid #3b82f6; }

        .step-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .step-badge { display: inline-flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; border-radius: 50%; font-size: 0.75rem; font-weight: bold; color: #fff; }
        .step-badge.active { background: #3b82f6; }
        .step-badge.completed { background: #10b981; }
        .step-badge.pending { background: #cbd5e1; }
        .step-label { font-size: 0.8rem; font-weight: 500; color: #475569; }
        .step-divider { flex: 1; height: 2px; background: #e2e8f0; }

        .control-group { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
        .control-group h3 { font-size: 0.82rem; color: #475569; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between; }
        .control-group h3 .badge-icon { background: #3b82f6; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 8px; }

        .input-item { margin-bottom: 10px; }
        .input-item:last-child { margin-bottom: 0; }
        label { display: flex; justify-content: space-between; font-size: 0.82rem;

        label span.val { color: #2563eb; font-weight: 600; font-size: 0.78rem; }

        .btn-group { display: flex; gap: 8px; margin-top: 6px; }

        button { flex: 1; padding: 8px 12px; border: none; border-radius: 6px;

<style>

<script>
function showError(msg) {
    var b = document.getElementById('error-banner');
    b.textContent = '⚠ ' + msg; b.style.display = 'block'; console.error(msg);
}
function getEl(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }

// 检查依赖
if (typeof THREE === 'undefined' || typeof SunCalc === 'undefined') {
    showError('CDN 加载失败，请检查网络');
}

// ==================== 全局状态 ====================
var TARGET_Z = -35; // 目标楼北侧基准
var currentStep = 1;
var surroundingBuildings = [];
var nextBuildingId = 1;
var targetParams = { length: 40, width: 14, height: 54, floor: 6 };
var exposedResults = []; // 全天分钟级采样结果
var sunTimesCache = {}; // 日出日落时间缓存
var DAY_START = 0;   // 0:00
var DAY_END = 24;    // 24:00 (24h 循环)
var playInterval = null;

// ==================== 自研轨道控制器 ====================
function SimpleOrbitControls(camera, dom) {
    this.camera = camera; this.dom = dom;
    this.target = new THREE.Vector3(0, 20, TARGET_Z);
    this.theta = Math.PI / 4.5;
    this.phi = Math.PI / 3.8;
    this.radius = 160;
    this._thetaT = this.theta; this._phiT = this.phi; this._radiusT = this.radius;
    this.damping = 0.08;
    var self = this, dragging = false, lastX = 0, lastY = 0;
    dom.addEventListener('mousedown', function(e) { dragging = true; lastX = e.clientX; lastY = e.clientY; e.preventDefault(); });
    window.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        self._thetaT -= (e.clientX - lastX) * 0.005;
        self._phiT = Math.max(0.1, Math.min(Math.PI - 0.1, self._phiT + (e.clientY - lastY) * 0.005));
        lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('mouseup', function() { dragging = false; });
    dom.addEventListener('wheel', function(e) {
        self._radiusT = Math.max(60, Math.min(400, self._radiusT * (1 + e.deltaY * 0.001)));
        e.preventDefault();
    }, { passive: false });
    dom.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    this.update = function() {
        self.theta += (self._thetaT - self.theta) * self.damping;
        self.phi += (self._phiT - self.phi) * self.damping;
        self.radius += (self._radiusT - self.radius) * self.damping;
        var x = self.target.x + self.radius * Math.sin(self.phi) * Math.cos(self.theta);
        var y = self.target.y + self.radius * Math.cos(self.phi);
        var z = self.target.z + self.radius * Math.sin(self.phi) * Math.sin(self.theta);
        self.camera.position.set(x, y, z);
        self.camera.lookAt(self.target);
    };
}

// ==================== Three.js 全局 ====================
var container = document.getElementById('canvas-container');
var scene, camera, renderer, controls;
var sunLight, ambientLight, sunMesh;
var targetBuilding, targetRoomMesh, groundMesh, compassArrow;
var surroundingMeshes = [];

var matSouth = new THREE.MeshLambertMaterial({ color: 0x94a3b8 });
var matEast = new THREE.MeshLambertMaterial({ color: 0x475569 });
var matWest = new THREE.MeshLambertMaterial({ color: 0x334155 });
var matGround = new THREE.MeshLambertMaterial({ color: 0x10b981 }); // 柔和绿色地表

// 观测楼层半透明黄色材质（全局唯一，固定引用）
var matRoomHighlight = new THREE.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.7, depthWrite: false });

var FLOOR_BAND_COLORS = [
    ['#3b82f6', '#93c5fd'],   // 蓝
    ['#0ea5e9', '#7dd3fc'],   // 青
    ['#14b8a6', '#5eead4'],   // 绿
    ['#6366f1', '#a5b4fc'],   // 紫
    ['#8b5cf6', '#c4b5fd']    // 粉紫
];

/**
 * 生成带竖向分段色彩（每5层变色调）和丰富窗户细节的立面贴图
 * bandIndex: 段号（0起始），每5层一段
 */
function generateFacadeTexture(lenM, heiM, floorH, isSouth, bandIndex) {
    var tw = 512, th = 512, cv = document.createElement('canvas');
    cv.width = tw; cv.height = th;
    var ctx = cv.getContext('2d');

    // 每5层一段取色
    var bandIdx = bandIndex % FLOOR_BAND_COLORS.length;
    var wallColor = isSouth ? FLOOR_BAND_COLORS[bandIdx][0] : '#475569';
    var wallLight = isSouth ? FLOOR_BAND_COLORS[bandIdx][1] : '#64748b';

    // 墙体底色渐变
    var grd = ctx.createLinearGradient(0, 0, 0, th);
    grd.addColorStop(0, wallLight);
    grd.addColorStop(0.5, wallColor);
    grd.addColorStop(1, wallLight);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, tw, th);

    // 楼层分割水平线
    var cols = Math.max(2, Math.round(lenM / 3));
    var rows = Math.max(1, Math.round(heiM / floorH));
    var cw = tw / cols, ch = th / rows;

    // 楼层横向分隔带（每5层加深强调）
    for (var j = 0; j <= rows; j++) {
        if (j % 5 === 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0, j * ch - 1, tw, 2);
        }
    }

    // 窗户
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
        var wx = c * cw + cw * 0.18;
        var wy = (rows - 1 - r) * ch + ch * 0.2;
        var ww = cw * 0.64, wh = ch * 0.62;

        // 窗洞阴影
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(wx - 1, wy - 1, ww + 2, wh + 2);

        // 玻璃
        var isLit = (r + c) % 2 === 0;
        var gB = isLit ? wallColor : '#1e3a5f';
        ctx.fillStyle = gB;
        ctx.fillRect(wx, wy, ww, wh);

        // 玻璃横向高光（模拟反光）
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(wx, wy + 2, ww, 3);

        // 窗框
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.6;
        ctx.strokeRect(wx + 0.5, wy + 0.5, ww - 1, wh - 1);

        // 窗台（底部凸出）
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(wx - 1, wy + wh, ww + 2, 2);
    }

    // 竖向窗框
    for (var i = 1; i < cols; i++) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(i * cw, 0);
        ctx.lineTo(i * cw, th);
        ctx.stroke();
    }
    for (var j2 = 1; j2 < rows; j2++) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(0, j2 * ch);
        ctx.lineTo(tw, j2 * ch);
        ctx.stroke();
    }

    var tex = new THREE.CanvasTexture(cv);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    return tex;
}

/**
 * 为目标楼 6 个面生成材质数组，每 5 层一段不同色调
 * BoxGeometry: +X, -X, +Y, -Y, +Z(南), -Z(北)
 */
function createTargetMaterials(lenM, heiM, floorH) {
    var floors = Math.max(1, Math.round(heiM / floorH));
    var bands = Math.ceil(floors / 5);
    var roofMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
    var mats = [];
    // 东、西侧：按每5层一段贴图
    mats.push(buildAxisMaterials(lenM, heiM, floorH, false, 'side', bands, floors));
    mats.push(buildAxisMaterials(lenM, heiM, floorH, false, 'side', bands, floors));
    // 屋顶、地面
    mats.push(roofMat);
    mats.push(roofMat);
    // 南立面（主采光面）
    mats.push(buildAxisMaterials(lenM, heiM, floorH, true, 'south', bands, floors));
    // 北立面
    mats.push(buildAxisMaterials(lenM, heiM, floorH, false, 'north', bands, floors));
    return mats;
}

/**
 * 由于 BoxGeometry 每个面只容一张贴图，我们生成一张纵向合并的贴图：
 * 每5层一小段贴图纵向堆叠，总计覆盖整面墙
 */
function buildAxisMaterials(lenM, heiM, floorH, isSouth, face, bands, floors) {
    // 每个分段生成小贴图后合并到一张大贴图
    var tw = 512;
    var segH = Math.max(64, Math.floor(512 / bands));
    var cv = document.createElement('canvas');
    cv.width = tw;
    cv.height = segH * bands;
    var ctx = cv.getContext('2d');
    for (var bi = 0; bi < bands; bi++) {
        var segTex = generateFacadeTexture(lenM, floorH * 5, floorH, isSouth, bi);
        // 把 CanvasTexture 源的 canvas 复制到大画布对应段
        if (segTex.image) {
            ctx.drawImage(segTex.image, 0, (bands - 1 - bi) * segH, tw, segH);
        }
    }
    var mergedTex = new THREE.CanvasTexture(cv);
    mergedTex.wrapS = THREE.RepeatWrapping;
    mergedTex.wrapT = THREE.ClampToEdgeWrapping;
    return new THREE.MeshLambertMaterial({ map: mergedTex });
}

// ==================== 初始化场景 ====================

// ==================== 建筑创建 ====================
function createBuildings() {
    if (typeof scene === 'undefined' || !scene) return; // 场景未初始化时跳过
    try {
        if (targetBuilding) scene.remove(targetBuilding);
        if (targetRoomMesh) scene.remove(targetRoomMesh);
        surroundingMeshes.forEach(function(m) { scene.remove(m); });
        surroundingMeshes = [];
        var floorH = 3;
        var targetL = targetParams.length, targetW = targetParams.width, targetH = targetParams.height;
        var targetFloor = parseInt(getEl('target-floor').value) || targetParams.floor;
        targetFloor = Math.min(targetFloor, Math.floor(targetH / floorH));

        var targetMats = createTargetMaterials(targetL, targetH, floorH);
        targetBuilding = new THREE.Mesh(new THREE.BoxGeometry(targetL, targetH, targetW), targetMats);
        targetBuilding.position.set(0, targetH / 2, TARGET_Z);
        targetBuilding.castShadow = true; targetBuilding.receiveShadow = true;
        scene.add(targetBuilding);

        var roomCenterY = (targetFloor - 0.5) * floorH;
        targetRoomMesh = new THREE.Mesh(new THREE.BoxGeometry(targetL + 1, floorH - 0.15, targetW + 1), matRoomHighlight);
        targetRoomMesh.position.set(0, roomCenterY, TARGET_Z);
        scene.add(targetRoomMesh);

        surroundingBuildings.forEach(function(sb) {
            var mat;
            if (sb.posX > 30) mat = matEast;
            else if (sb.posX < -30) mat = matWest;
            else mat = matSouth;
            var absZ = TARGET_Z + targetParams.width / 2 + sb.posZ + sb.width / 2;
            var mesh = new THREE.Mesh(new THREE.BoxGeometry(sb.length, sb.height, sb.width), mat);
            mesh.position.set(sb.posX, sb.height / 2, absZ);
            mesh.castShadow = true; mesh.receiveShadow = true;
            scene.add(mesh);
            surroundingMeshes.push(mesh);
        });
    } catch (e) {
        showError('建筑创建失败: ' + e.message);
    }
}

// ==================== 俯瞰图 ====================
function drawOverview() {
    try {
        var canvas = document.getElementById('overview-canvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        // 自适应比例尺：确保所有楼都落在画布内
        var minX = -1, maxX = 1, minZ = TARGET_Z + targetParams.width / 2, maxZ = TARGET_Z + targetParams.width / 2;
        surroundingBuildings.forEach(function(b) {
            var absZ = TARGET_Z + targetParams.width / 2 + b.posZ + b.width / 2;
            minX = Math.min(minX, b.posX - b.length / 2); maxX = Math.max(maxX, b.posX + b.length / 2);
            minZ = Math.min(minZ, absZ - b.width / 2); maxZ = Math.max(maxZ, absZ + b.width / 2);
        });
        // 把目标楼也纳入
        minX = Math.min(minX, -targetParams.length / 2); maxX = Math.max(maxX, targetParams.length / 2);
        minZ = Math.min(minZ, TARGET_Z - targetParams.width / 2);
        var rangeX = Math.max(maxX - minX, 10), rangeZ = Math.max(maxZ - minZ, 10);
        var scale = Math.min((w - 10) / rangeX, (h - 10) / rangeZ);
        scale = Math.max(0.3, Math.min(scale, 2.0));

        var cx = w / 2 - (minX + maxX) / 2 * scale;
        // Z 基准以目标楼南侧为垂直基准
        var zBase = h * 0.42 - (TARGET_Z + targetParams.width / 2) * scale;

        // 网格线
        ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 0.5;
        for (var i = -6; i <= 6; i++) {
            ctx.beginPath(); ctx.moveTo(cx + i * 20, 0); ctx.lineTo(cx + i * 20, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, zBase + i * 20 - (TARGET_Z + targetParams.width / 2) * scale); ctx.lineTo(w, zBase + i * 20 - (TARGET_Z + targetParams.width / 2) * scale); ctx.stroke();
        }
        // 南北标记
        ctx.font = '9px sans-serif'; ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center';
        ctx.fillText('N↑', cx + (minX + maxX) / 2 * scale, 12);
        ctx.fillText('S↓', cx + (minX + maxX) / 2 * scale, h - 4);
        ctx.textAlign = 'left';

        drawBoxOv(ctx, 0, TARGET_Z, targetParams.length, targetParams.width, '#3b82f6', scale, cx, zBase);
        surroundingBuildings.forEach(function(b) {
            var color;
            if (b.posX > 30) color = '#64748b';
            else if (b.posX < -30) color = '#475569';
            else color = '#94a3b8';
            var absZ = TARGET_Z + targetParams.width / 2 + b.posZ + b.width / 2;
            drawBoxOv(ctx, b.posX, absZ, b.length, b.width, color, scale, cx, zBase);
        });
    } catch (e) { console.warn('drawOverview:', e); }
}

function drawBoxOv(ctx, x, z, len, wid, color, scale, cx, zBase) {
    ctx.fillStyle = color; ctx.globalAlpha = 0.85;
    var rx = cx + x * scale, rz = zBase + z * scale;
    var hw = len * scale / 2, hd = wid * scale / 2;
    ctx.fillRect(rx - hw / 2, rz - hd / 2, hw, hd);
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.globalAlpha = 1;
    ctx.strokeRect(rx - hw / 2, rz - hd / 2, hw, hd);
}

// ==================== 核心：精确阴影检测 ====================
// 从窗户中心向太阳方向发射线，与任一遮挡楼 AABB 相交则遮挡
// 方向朝南/东/西/北 决定是否能接收到阳光

function getWindowCenterTarget(orientation) {
    var targetFloor = parseInt(getEl('target-floor').value) || targetParams.floor;
    var targetY = (targetFloor - 0.5) * 3;
    var tx = 0, ty = targetY, tz = TARGET_Z;
    // 窗户朝向偏移（外表面）
    if (orientation === 'south') tz += targetParams.width / 2;
    else if (orientation === 'north') tz -= targetParams.width / 2;
    else if (orientation === 'east') tx += targetParams.length / 2;
    else if (orientation === 'west') tx -= targetParams.length / 2;
    return { x: tx, y: ty, z: tz, orientation: orientation };
}

// 建筑物 AABB: [min, max]
function getBuildingAABB(sb) {
    // posZ 是相对目标楼南侧面的偏移量（≥0 = 在南侧），需要转换为绝对坐标
    var absZ = TARGET_Z + targetParams.width / 2 + sb.posZ + sb.width / 2;
    return {
        min: { x: sb.posX - sb.length / 2, y: 0, z: absZ - sb.width / 2 },
        max: { x: sb.posX + sb.length / 2, y: sb.height, z: absZ + sb.width / 2 }
    };
}

// 射线（从点P沿方向D）与AABB相交检测（Slab法）
function rayIntersectsAABB(P, D, aabb) {
    if (Math.abs(D.x) < 1e-8) D.x = D.x >= 0 ? 1e-8 : -1e-8;
    if (Math.abs(D.y) < 1e-8) D.y = D.y >= 0 ? 1e-8 : -1e-8;
    if (Math.abs(D.z) < 1e-8) D.z = D.z >= 0 ? 1e-8 : -1e-8;
    var txmin = (aabb.min.x - P.x) / D.x;
    var txmax = (aabb.max.x - P.x) / D.x;
    if (txmin > txmax) { var t = txmin; txmin = txmax; txmax = t; }
    var tymin = (aabb.min.y - P.y) / D.y;
    var tymax = (aabb.max.y - P.y) / D.y;
    if (tymin > tymax) { t = tymin; tymin = tymax; tymax = t; }
    var tzmin = (aabb.min.z - P.z) / D.z;
    var tzmax = (aabb.max.z - P.z) / D.z;
    if (tzmin > tzmax) { t = tzmin; tzmin = tzmax; tzmax = t; }
    var tmin = Math.max(txmin, tymin, tzmin);
    var tmax = Math.min(txmax, tymax, tzmax);
    return tmax >= tmin && tmax > 0 ? tmin : -1;
}

// 计算某一时刻的太阳方向单位向量（从窗户指向太阳）
// az=方位角(北0东π/2南π西-π/2)... 实际上 SunCalc az: 0=南 π/2=西 π=北 -π/2=东
function getSunVector(alt, az) {
    // SunCalc 的 az 是从南起算: 0=南, π/2=西, π=北, -(π/2)=东
    // 转换为坐标系: +X=东, -X=西, +Y=上, +Z=南, -Z=北
    var cx = -Math.cos(alt) * Math.sin(az);   // az=π/2(西)→-cos(alt)→西(-X); az=-π/2(东)→+cos(alt)→东(+X)
    var cy = Math.sin(alt);                   // 高度角
    var cz = Math.cos(alt) * Math.cos(az);    // az=0(南)→+cos(alt)→+Z(南); az=π(北)→-cos(alt)→-Z(北)
    return { x: cx, y: cy, z: cz };
}

// 方向 dot 太阳方向 > 0 表示窗户能接受直射
function canFaceReceiveSun(orientation, sunVec) {
    if (orientation === 'south') return sunVec.z > 0.001;
    if (orientation === 'north') return sunVec.z < -0.001;
    if (orientation === 'east') return sunVec.x > 0.001;
    if (orientation === 'west') return sunVec.x < -0.001;
    return false;
}

// 给定太阳位置，精确判断是否有遮挡
function checkShadowAtMoment(altRad, azRad, orientation) {
    if (altRad <= 0) return { status: 'night', blocker: null };
    var sunVec = getSunVector(altRad, azRad);
    if (!canFaceReceiveSun(orientation, sunVec)) {
        return { status: 'night', blocker: null }; // 太阳不在窗户朝向一侧
    }
    // 从窗户中心发射向太阳的射线
    var win = getWindowCenterTarget(orientation);
    var best_t = Infinity, best_sb = null;
    for (var i = 0; i < surroundingBuildings.length; i++) {
        var sb = surroundingBuildings[i];
        // 只检测在窗户前方的楼（与太阳方向一致的一侧）
        // posZ 相对目标楼南侧（≥0=南侧）：南向太阳只看东/西/南侧楼栋
        if (orientation === 'south') { /* 所有楼都在南侧或有东西偏移，全部考虑 */ }
        else if (orientation === 'east' && sb.posX <= 0) continue;
        else if (orientation === 'west' && sb.posX >= 0) continue;
        else if (orientation === 'north') continue;

        var aabb = getBuildingAABB(sb);
        var t = rayIntersectsAABB(win, sunVec, aabb);
        if (t > 0 && t < best_t) { best_t = t; best_sb = sb; }
    }
    if (best_sb) return { status: 'shadow', blocker: best_sb };
    return { status: 'sun', blocker: null };
}

// ==================== 全天采样 ====================
function calculateDayExposure() {
    try {
        var cityVal = getEl('city-select').value.split(',');
        var lat = parseFloat(cityVal[0]), lon = parseFloat(cityVal[1]);
        var dateStr = getEl('date-input').value;
        var orientation = getEl('orientation-select').value;
        // 日出日出
        var dateObj = new Date(dateStr + 'T12:00:00');
        var times = SunCalc.getTimes(dateObj, lat, lon);
        sunTimesCache = { sunrise: times.sunrise, sunset: times.sunset };
        getEl('date-display').textContent = dateStr.slice(5).replace('-', '/');

        exposedResults = [];
        var stepMin = 1; // 每1分钟采样一次
        for (var m = DAY_START * 60; m < DAY_END * 60; m += stepMin) {
            var hh = Math.floor(m / 60);
            var mm = m % 60;
            var dateObj2 = new Date(dateStr + 'T' + pad(hh) + ':' + pad(mm) + ':00');
            var sp = SunCalc.getPosition(dateObj2, lat, lon);
            var r = checkShadowAtMoment(sp.altitude, sp.azimuth, orientation);
            r.alt = sp.altitude * 180 / Math.PI;
            r.az = (sp.azimuth * 180 / Math.PI + 360) % 360;
            r.minOfDay = m;
            r.hour = hh + mm / 60;
            exposedResults.push(r);
        }
        drawTimeline();
    } catch (e) {
        showError('计算失败: ' + e.message);
    }
}

// ==================== 时间轴绘制 ====================
function drawTimeline() {
    var canvas = document.getElementById('timeline-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    var totalMin = (DAY_END - DAY_START) * 60;
    var pxPerMin = w / totalMin;

    // 整理连续段
    var segments = [], cur = null;
    exposedResults.forEach(function(r) {
        if (!cur || cur.status !== r.status) {
            if (cur) segments.push(cur);
            cur = { status: r.status, startMin: r.minOfDay, endMin: r.minOfDay };
        } else {
            cur.endMin = r.minOfDay;
        }
    });
    if (cur) segments.push(cur);

    // 分钟统计
    var sunMin = 0, shadowMin = 0, nightMin = 0;
    segments.forEach(function(s) {
        var dur = s.endMin - s.startMin + 1;
        if (s.status === 'sun') sunMin += dur;
        else if (s.status === 'shadow') shadowMin += dur;
        else nightMin += dur;
    });
    var daylightMin = sunMin + shadowMin;
    var pct = daylightMin > 0 ? ((sunMin / daylightMin) * 100).toFixed(1) : '0.0';

    // 绘制（按 z 顺序：夜间 → 直射 → 遮挡，确保高亮色覆盖暗色）
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 0, w, h); // 夜间底色
    // 第一遍：夜间段
    segments.forEach(function(s) {
        if (s.status !== 'night') return;
        var x1 = (s.startMin - DAY_START * 60) * pxPerMin;
        var x2 = (s.endMin - DAY_START * 60 + 1) * pxPerMin;
        ctx.fillStyle = 'rgba(30,41,59,0.55)';
        ctx.fillRect(x1, 0, x2 - x1, h);
    });
    // 第二遍：直射段
    segments.forEach(function(s) {
        if (s.status !== 'sun') return;
        var x1 = (s.startMin - DAY_START * 60) * pxPerMin;
        var x2 = (s.endMin - DAY_START * 60 + 1) * pxPerMin;
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(x1, 0, x2 - x1, h);
    });
    // 第三遍：遮挡段
    segments.forEach(function(s) {
        if (s.status !== 'shadow') return;
        var x1 = (s.startMin - DAY_START * 60) * pxPerMin;
        var x2 = (s.endMin - DAY_START * 60 + 1) * pxPerMin;
        ctx.fillStyle = '#ef4444'; ctx.fillRect(x1, 0, x2 - x1, h);
    });

    // 顶部标签栏
    var lblRow = document.querySelector('.time-axis-label-row');
    if (lblRow) {
        var nightP = (nightMin / totalMin) * 100;
        var sunP = (sunMin / totalMin) * 100;
        var shadowP = (shadowMin / totalMin) * 100;
        lblRow.innerHTML =
            '<span class="tl-label night" style="flex:' + nightP.toFixed(1) + '">' + nightP.toFixed(0) + '%</span>' +
            '<span class="tl-label sun" style="flex:' + sunP.toFixed(1) + '">' + sunP.toFixed(0) + '%</span>' +
            '<span class="tl-label shadow" style="flex:' + shadowP.toFixed(1) + '">' + shadowP.toFixed(0) + '%</span>';
    }

    getEl('stat-total').textContent = formatDuration(sunMin);
    getEl('stat-pct').textContent = pct + '%';

    var sunPeriods = segments.filter(function(s) { return s.status === 'sun'; });
    var periodStrs = sunPeriods.map(function(s) {
        return fmtHour(s.startMin) + '-' + fmtHour(s.endMin + 1);
    });
    getEl('stat-periods').textContent = periodStrs.join(', ') || '—';
}

function fmtHour(minOfDay) {
    var h = Math.floor(minOfDay / 60), m = minOfDay % 60;
    return pad(h) + ':' + pad(m);
}
function formatDuration(minutes) {
    if (minutes < 60) return minutes + 'min';
    var h = Math.floor(minutes / 60), m = minutes % 60;
    return h + 'h' + (m > 0 ? m + 'm' : '');
}

// ==================== 实时时刻更新 ====================
function updateAtSliderTime() {
    if (currentStep !== 2) return;
    if (typeof SunCalc === 'undefined') return;
    try {
        var cityVal = getEl('city-select').value.split(',');
        var lat = parseFloat(cityVal[0]), lon = parseFloat(cityVal[1]);
        var dateStr = getEl('date-input').value;
        var timeHours = parseFloat(getEl('time-slider').value);
        var hh = Math.floor(timeHours), mm = Math.floor((timeHours - hh) * 60);
        getEl('time-val').textContent = pad(hh) + ':' + pad(mm);
        var dateObj = new Date(dateStr + 'T' + pad(hh) + ':' + pad(mm) + ':00');
        var sp = SunCalc.getPosition(dateObj, lat, lon);
        var alt = sp.altitude * 180 / Math.PI;
        var az = (sp.azimuth * 180 / Math.PI + 360) % 360;

        // 更新采光时间轴上的进度指示器
        var tlCanvas = document.getElementById('timeline-canvas');
        var tlWrap = tlCanvas ? tlCanvas.closest('.time-axis-wrapper') : null;
        if (tlWrap) {
            var indicator = tlWrap.querySelector('.time-axis-current');
            if (indicator) {
                var curMinTot = (timeHours - DAY_START) * 60;
                var total = (DAY_END - DAY_START) * 60;
                var pctPos = Math.max(0, Math.min(1, curMinTot / total)) * 100;
                indicator.style.left = pctPos + '%';
                indicator.style.display = 'block';
            }
        }

        // 三维太阳 + 天空（仅在 WebGL 场景已初始化时更新）
        if (typeof scene !== 'undefined' && scene && sunLight && sunMesh) {
        var R = 150;
        var altR = sp.altitude, azR = sp.azimuth;
        if (altR < 0) {
            sunLight.intensity = 0; ambientLight.intensity = 0.06;
            scene.background.setHex(0xcbd5e1); // 夜间柔和灰蓝
            sunMesh.visible = false;
        } else {
            sunLight.intensity = Math.max(0.3, Math.sin(altR) * 1.2);
            ambientLight.intensity = 0.3 + Math.sin(altR) * 0.3;
            sunMesh.visible = true;
            // SunCalc az: 0=南 π/2=西 π=北 -(π/2)=东; -Z=北 +Z=南 +X=东 -Y=下方
            var sx = -R * Math.cos(altR) * Math.sin(azR);
            var sy = R * Math.sin(altR);
            var sz = R * Math.cos(altR) * Math.cos(azR);
            sunLight.position.set(sx, sy, sz);
            sunMesh.position.set(sx, sy, sz);
            // 天空随高度柔和过渡：暖橙↔冷灰蓝
            var t = Math.max(0, Math.min(1, Math.sin(altR)));
            var warm = { r: 0.99, g: 0.85, b: 0.75 };
            var cool = { r: 0.88, g: 0.92, b: 0.96 };
            scene.background.setRGB(
                cool.r + (warm.r - cool.r) * t,
                cool.g + (warm.g - cool.g) * t,
                cool.b + (warm.b - cool.b) * t
            );
        }
        }

        var orientation = getEl('orientation-select').value;
        var r = checkShadowAtMoment(sp.altitude, sp.azimuth, orientation);
        var statusEl = getEl('light-status');
        var blockEl = getEl('blocking-info');
        if (r.status === 'sun') {
            statusEl.textContent = '✓ 光照充足'; statusEl.className = 'status-badge badge-sun';
            blockEl.textContent = '无';
        } else if (r.status === 'shadow') {
            statusEl.textContent = '● 遮挡'; statusEl.className = 'status-badge badge-shadow';
            blockEl.textContent = r.blocker.name || '楼#' + r.blocker.id;
        } else {
            statusEl.textContent = '○ 无直射光'; statusEl.className = 'status-badge badge-night';
            blockEl.textContent = '太阳不在该朝向';
        }

    } catch (e) {
        showError('更新失败: ' + e.message);
    }
}

// ==================== 步骤切换 ====================
function goToStep2() {
    currentStep = 2;
    getEl('step1-panel').classList.add('hidden');
    getEl('step2-panel').classList.remove('hidden');
    document.getElementById('step1-badge').classList.remove('active');
    document.getElementById('step1-badge').classList.add('completed');
    document.getElementById('step1-badge').textContent = '✓';
    document.getElementById('step2-badge').classList.remove('pending');
    document.getElementById('step2-badge').classList.add('active');
    setTimeout(function() { calculateDayExposure(); updateAtSliderTime(); onWindowResize(); }, 100);
}
function goToStep1() {
    currentStep = 1;
    getEl('step2-panel').classList.add('hidden');
    getEl('step1-panel').classList.remove('hidden');
    document.getElementById('step1-badge').classList.remove('completed');
    document.getElementById('step1-badge').classList.add('active');
    document.getElementById('step1-badge').textContent = '1';
    document.getElementById('step2-badge').classList.remove('active');
    document.getElementById('step2-badge').classList.add('pending');
    setTimeout(function() { drawOverview(); onWindowResize(); }, 50);
}

// ==================== 周围楼栋管理 ====================
function addSurroundingBuilding() {
    var id = nextBuildingId++;
    var building = { id: id, name: '楼#' + id, length: 40, width: 14, height: 54, posX: 0, posZ: 35 };
    surroundingBuildings.push(building);
    renderSurroundingList(); createBuildings(); drawOverview();
}
function removeSurroundingBuilding(id) {
    surroundingBuildings = surroundingBuildings.filter(function(b) { return b.id !== id; });
    renderSurroundingList(); createBuildings(); drawOverview();
}
function updateSurroundingParam(id, key, value) {
    var b = surroundingBuildings.find(function(x) { return x.id === id; });
    if (!b) return;
    b[key] = parseFloat(value);
    refreshSBVal(b, 'length'); refreshSBVal(b, 'width');
    refreshSBVal(b, 'height', true); refreshSBVal(b, 'posX', false, 'X');
    refreshSBVal(b, 'posZ', false, 'Z');
    createBuildings(); drawOverview();
}
function refreshSBVal(b, key, showFloor, label) {
    var el = document.getElementById('sb-' + b.id + '-' + key + '-val');
    if (!el) return;
    if (key === 'posZ') {
        // posZ 是相对目标楼南侧的距离，标签已改为"南距"
        el.textContent = b.posZ + 'm';
    } else if (key === 'height') {
        el.textContent = b.height + 'm (' + Math.round(b.height / 3) + '层)';
    } else {
        el.textContent = b[key] + 'm';
    }
}
function renderSurroundingList() {
    var list = document.getElementById('surrounding-list');
    getEl('surrounding-count').textContent = surroundingBuildings.length + '栋';
    list.innerHTML = '';
    surroundingBuildings.forEach(function(b) {
        var el = document.createElement('div');
        el.className = 'surrounding-building';
        var xLabel = b.posX > 0 ? '东' + b.posX + 'm' : (b.posX < 0 ? '西' + (-b.posX) + 'm' : '0m');
        el.innerHTML =
            '<div class="sb-header"><span class="sb-title">' + b.name + '</span>' +
            '<button class="danger" onclick="removeSurroundingBuilding(' + b.id + ')" style="flex:0;padding:2px 10px;font-size:0.7rem;">×</button></div>' +
            '<div class="dimension-grid">' +
            '<div class="input-item"><label>长<span class="val" id="sb-' + b.id + '-length-val">' + b.length + 'm</span></label><input type="range" min="10" max="120" value="' + b.length + '" oninput="updateSurroundingParam(' + b.id + ',\'length\',this.value)"></div>' +
            '<div class="input-item"><label>宽<span class="val" id="sb-' + b.id + '-width-val">' + b.width + 'm</span></label><input type="range" min="6" max="40" value="' + b.width + '" oninput="updateSurroundingParam(' + b.id + ',\'width\',this.value)"></div>' +
            '<div class="input-item"><label>高<span class="val" id="sb-' + b.id + '-height-val">' + b.height + 'm</span></label><input type="range" min="6" max="150" value="' + b.height + '" oninput="updateSurroundingParam(' + b.id + ',\'height\',this.value)"></div>' +
            '</div>' +
            '<div class="pos-coord" style="margin-top:8px;">' +
            '<div class="input-item"><label>东西(X)<span class="val" id="sb-' + b.id + '-posX-val">' + xLabel + '</span></label><input type="range" min="-80" max="80" value="' + b.posX + '" oninput="updateSurroundingParam(' + b.id + ',\'posX\',this.value)"></div>' +
            '<div class="input-item"><label>南距(Z)<span class="val" id="sb-' + b.id + '-posZ-val">' + b.posZ + 'm</span></label><input type="range" min="0" max="100" value="' + b.posZ + '" oninput="updateSurroundingParam(' + b.id + ',\'posZ\',this.value)"></div>' +
            '</div>';
        list.appendChild(el);
        refreshSBVal(b, 'height', true);
    });
}

// ==================== 事件绑定 ====================
function bindAllEvents() {
    ['target-length', 'target-width', 'target-height', 'target-floor'].forEach(function(id) {
        getEl(id).addEventListener('input', function() {
            targetParams.length = parseFloat(getEl('target-length').value);
            targetParams.width = parseFloat(getEl('target-width').value);
            targetParams.height = parseFloat(getEl('target-height').value);
            targetParams.floor = parseInt(getEl('target-floor').value);
            getEl('target-length-val').textContent = getEl('target-length').value + 'm';
            getEl('target-width-val').textContent = getEl('target-width').value + 'm';
            getEl('target-height-val').textContent = getEl('target-height').value + 'm (' + Math.round(getEl('target-height').value / 3) + '层)';
            var floors = Math.floor(getEl('target-height').value / 3);
            getEl('target-floor').max = floors;
            getEl('target-floor-val').textContent = Math.min(getEl('target-floor').value, floors) + '层';
            createBuildings(); drawOverview();
        });
    });
    getEl('add-building-btn').addEventListener('click', addSurroundingBuilding);
    getEl('go-step2-btn').addEventListener('click', goToStep2);
    getEl('go-step1-btn').addEventListener('click', goToStep1);
    getEl('btn-winter').addEventListener('click', function() { setDate('2026-12-22'); });
    getEl('btn-equinox').addEventListener('click', function() { setDate('2026-03-21'); });
    getEl('btn-summer').addEventListener('click', function() { setDate('2026-06-21'); });
    getEl('date-input').addEventListener('input', function() { setDate(getEl('date-input').value); });
    getEl('city-select').addEventListener('input', function() { calculateDayExposure(); updateAtSliderTime(); });
    getEl('orientation-select').addEventListener('input', function() { calculateDayExposure(); updateAtSliderTime(); });
    getEl('time-slider').addEventListener('input', function() { updateAtSliderTime(); });
    getEl('play-btn').addEventListener('click', togglePlay);
    getEl('btn-recalc').addEventListener('click', function() { calculateDayExposure(); updateAtSliderTime(); });
}

function setDate(dateStr) {
    getEl('date-input').value = dateStr;
    calculateDayExposure();
    updateAtSliderTime();
}

function togglePlay() {
    if (playInterval) {
        clearInterval(playInterval); playInterval = null;
        getEl('play-btn').textContent = '▶ 播放整天';
    } else {
        getEl('play-btn').textContent = '⏸ 暂停';
        var slider = getEl('time-slider');
        playInterval = setInterval(function() {
            var v = parseFloat(slider.value) + 0.03;
            if (v > DAY_END) v = DAY_START;
            slider.value = v.toFixed(2);
            updateAtSliderTime();
        }, 30);
    }
}

function onWindowResize() {
    if (!renderer) return;
    camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
    requestAnimationFrame(animate);
    if (controls) controls.update();
    if (renderer && scene && camera) renderer.render(scene, camera);
}


// ==================== 启动 ====================
if (typeof THREE !== 'undefined' && typeof SunCalc !== 'undefined') {
    function startAll() {
        initScene();
        setTimeout(function() {
            try { applyDefaultBuildings(); }
            catch (e) { console.warn('默认楼栋加载失败:', e); }
        }, 200);
    }
    function applyDefaultBuildings() {
        if (typeof scene === 'undefined' || !scene) return; // 场景未初始化时跳过
        if (surroundingBuildings.length < 2) {
            addSurroundingBuilding();
            addSurroundingBuilding();
            surroundingBuildings[0].name = '南楼';
            surroundingBuildings[0].posZ = 40;
            surroundingBuildings[0].height = 60;
            surroundingBuildings[0].length = 30;
            surroundingBuildings[0].width = 12;
            surroundingBuildings[1].name = '西南楼';
            surroundingBuildings[1].posX = 30;
            surroundingBuildings[1].posZ = 35;
            surroundingBuildings[1].height = 45;
            surroundingBuildings[1].length = 20;
            surroundingBuildings[1].width = 14;
            renderSurroundingList();
            createBuildings();
            drawOverview();
        }
    }
    window.addEventListener('load', startAll);
} else {
    window.addEventListener('load', function() {
        showError('CDN 加载失败 — THREE=' + typeof THREE + ' SunCalc=' + typeof SunCalc);
    });
}
</script>
